services:
  nginx:
    container_name: nginx
    build: ./requirements/nginx/
    ports:
      - "443:443"
    env_file:
      - .env
    depends_on:
      - wordpress
    networks:
      - inception
    volumes:
      - wordpress:/home/pioupia/wordpress
    restart: always

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress/
    expose:
      - 9000
    env_file:
      - .env
    volumes:
      - wordpress:/home/pioupia/wordpress
    depends_on:
      mariadb:
          condition: service_healthy
    networks:
      - inception
    restart: always

  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb/
    expose:
      - 3306
    env_file:
      - .env
      - .db.env
    volumes:
      - mariadb:/home/pioupia/mariadb
    networks:
      - inception
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME}", "-p${DB_PASSWORD}"]
      timeout: 1s
      retries: 120
      start_period: 3s


volumes:
  wordpress:
    name: "wordpress"
  mariadb:
    name: "mariadb"


networks:
  inception:
    driver: bridge