services:
  nginx:
    container_name: nginx
    build: ./requirements/nginx/
    ports:
      - "443:443"
    env_file:
      - .env
    depends_on:
      - wordpress
      - adminer
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/wordpress
      - adminer_data:/var/www/adminer
    restart: always

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress/
    expose:
      - 9000
    env_file:
      - .env
      - .redis.env
    volumes:
      - wordpress_data:/var/www/wordpress/
    depends_on:
      mariadb:
          condition: service_healthy
      redis:
          condition: service_healthy
    networks:
      - inception
    restart: always

  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb/
    expose:
      - 3306
    env_file:
      - .env
      - .db.env
      - .roundcube.env
    volumes:
      - mariadb_data:/var/lib/mysql/
    networks:
      - inception
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME}", "-p${DB_PASSWORD}"]
      timeout: 1s
      start_period: 5s
      interval: 5s
      retries: 120

  adminer:
    container_name: adminer
    build: ./requirements/bonus/adminer/
    expose:
      - 9000
    networks:
      - inception
    volumes:
      - adminer_data:/var/www/adminer/
    restart: always

  ftp:
    container_name: ftp
    build:
      context: ./requirements/bonus/ftp/
      args:
        - DB_FTP_NAME=${DB_FTP_NAME}
        - DB_FTP_USERNAME=${DB_FTP_USERNAME}
        - DB_FTP_PASSWORD=${DB_FTP_PASSWORD}
        - FTP_USERNAME=${FTP_USER}
        - FTP_PASSWORD=${FTP_PASSWORD}
    ports:
      - "21:21"
      - "20:20"
      - "2000-2050:2000-2050"
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/wordpress
    depends_on:
      mariadb:
          condition: service_healthy
    restart: always
  
  redis:
    container_name: redis
    build: ./requirements/bonus/redis/
    expose:
      - 6379
    env_file:
      - .redis.env
    volumes:
      - redis_data:/var/lib/redis
    networks:
      - inception
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      timeout: 1s
      interval: 5s
      retries: 120

  kuma:
    container_name: kuma
    build: ./requirements/bonus/kuma/
    expose:
      - 3001
    volumes:
      - kuma_data:/var/www/kuma
    depends_on:
      - nginx
    networks:
      - inception
    restart: always

volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      device: /home/pioupia/data/wordpress
      o: bind
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      device: /home/pioupia/data/mariadb
      o: bind
  redis_data:
    driver: local
    driver_opts:
      type: none
      device: /home/pioupia/data/redis
      o: bind
  adminer_data:
    driver: local
    driver_opts:
      type: none
      device: /home/pioupia/data/adminer
      o: bind
  kuma_data:
    driver: local
    driver_opts:
      type: none
      device: /home/pioupia/data/kuma
      o: bind

networks:
  inception:
    driver: bridge